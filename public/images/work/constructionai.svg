<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!-- Job plan background for the construction card. Flat fills, hairline blue lines, no shading. -->
  <defs>
    <pattern id="minor" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#c9d6e6" stroke-width="1"/>
    </pattern>
    <pattern id="major" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="url(#minor)"/>
      <path d="M120 0H0V120" fill="none" stroke="#b3c4da" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#dfe6ee"/>
  <rect width="1920" height="1080" fill="url(#major)"/>

  <!-- sheet border -->
  <rect x="60" y="60" width="1800" height="960" fill="none" stroke="#1f4e8c" stroke-width="2"/>
  <rect x="72" y="72" width="1776" height="936" fill="none" stroke="#1f4e8c" stroke-width="1" opacity="0.5"/>

  <g stroke="#1f4e8c" fill="none" stroke-width="3" stroke-linecap="square">
    <!-- outer walls -->
    <path d="M300 240H1260V780H300Z"/>
    <!-- interior walls -->
    <path d="M300 480H700"/>
    <path d="M700 240V780"/>
    <path d="M700 620H1000"/>
    <path d="M1000 480V780"/>
    <path d="M1000 480H1260"/>
    <path d="M1000 360H1260"/>
  </g>

  <!-- door openings and swings -->
  <g stroke="#1f4e8c" fill="none" stroke-width="2">
    <path d="M540 480H600" stroke="#dfe6ee" stroke-width="5"/>
    <path d="M540 480V420"/>
    <path d="M540 420A60 60 0 0 1 600 480"/>
    <path d="M700 700V760" stroke="#dfe6ee" stroke-width="5"/>
    <path d="M700 700H760"/>
    <path d="M760 700A60 60 0 0 1 700 760"/>
    <path d="M1000 540V600" stroke="#dfe6ee" stroke-width="5"/>
    <path d="M1000 540H1060"/>
    <path d="M1060 540A60 60 0 0 1 1000 600"/>
    <!-- windows -->
    <path d="M380 240H480" stroke="#dfe6ee" stroke-width="5"/>
    <path d="M380 236H480M380 244H480"/>
    <path d="M1080 240H1180" stroke="#dfe6ee" stroke-width="5"/>
    <path d="M1080 236H1180M1080 244H1180"/>
    <path d="M300 640V720" stroke="#dfe6ee" stroke-width="5"/>
    <path d="M296 640V720M304 640V720"/>
  </g>

  <!-- dimension lines -->
  <g stroke="#1f4e8c" stroke-width="1.5" fill="none">
    <path d="M300 180H1260"/>
    <path d="M300 170V190M700 170V190M1000 170V190M1260 170V190"/>
    <path d="M1320 240V780"/>
    <path d="M1310 240H1330M1310 480H1330M1310 780H1330"/>
    <path d="M300 840H1260"/>
    <path d="M300 830V850M1260 830V850"/>
  </g>
  <g font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="18" fill="#1f4e8c" text-anchor="middle">
    <text x="500" y="166">24'-0"</text>
    <text x="850" y="166">18'-0"</text>
    <text x="1130" y="166">15'-6"</text>
    <text x="780" y="872">57'-6"</text>
    <text x="1360" y="365" transform="rotate(90 1360 365)">14'-0"</text>
    <text x="1360" y="635" transform="rotate(90 1360 635)">18'-0"</text>
  </g>

  <!-- room labels -->
  <g font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="16" fill="#1f4e8c" letter-spacing="3" opacity="0.8">
    <text x="330" y="300">OFFICE A</text>
    <text x="330" y="540">OFFICE B</text>
    <text x="730" y="300">OPEN PLAN</text>
    <text x="730" y="680">CONF</text>
    <text x="1030" y="300">ENTRY</text>
    <text x="1030" y="420">MECH</text>
    <text x="1030" y="540">STOR</text>
  </g>

  <!-- title block -->
  <g stroke="#1f4e8c" fill="none" stroke-width="1.5">
    <rect x="1420" y="740" width="420" height="260"/>
    <path d="M1420 800H1840M1420 860H1840M1420 920H1840M1630 800V1000"/>
  </g>
  <g font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#1f4e8c" letter-spacing="2">
    <text x="1440" y="776">JOB PLAN</text>
    <text x="1440" y="836">SHEET</text><text x="1650" y="836">A-101</text>
    <text x="1440" y="896">SCALE</text><text x="1650" y="896">1/4" = 1'-0"</text>
    <text x="1440" y="956">REV</text><text x="1650" y="956">03</text>
  </g>

  <!-- north arrow -->
  <g stroke="#1f4e8c" fill="none" stroke-width="1.5">
    <circle cx="1560" cy="200" r="40"/>
    <path d="M1560 160V240M1545 180L1560 160L1575 180"/>
  </g>
  <text x="1560" y="278" font-family="Geist Mono, ui-monospace, Menlo, monospace" font-size="14" fill="#1f4e8c" text-anchor="middle" letter-spacing="2">N</text>
</svg>
